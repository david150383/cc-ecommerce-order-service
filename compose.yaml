# Standalone dependencies for working on this service alone.
name: ecommerce-order-service

services:
  mongo:
    image: mongo:8
    ports: ["27018:27017"]
    volumes: ["order-mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 10

volumes:
  order-mongo:
