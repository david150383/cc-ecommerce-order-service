name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --norc --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 15s --health-retries 10
      # Local AWS emulator for the SNS/SQS messaging tests.
      floci:
        image: floci/floci:2.0.1
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_floci/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/order_test
      TEST_AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests (also checks openapi/openapi.json is current)
        run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and migrate images (not pushed until Phase 7)
        run: |
          docker buildx build --target runtime -t ecommerce-order-service:${{ github.sha }} --load .
          docker buildx build --target migrate -t ecommerce-order-service-migrate:${{ github.sha }} --load .
